# Pushing a tag like v0.1, or running this by hand on main, builds the apps for
# the version in ryui.json, uploads the iOS build to TestFlight, and publishes a
# GitHub release with both builds. The release stays a draft until all of that
# has worked. See the README's Release section for the secrets this needs.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write # to tag, create the release and attach the builds

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: the tag, from ryui.json's version
        id: tag
        run: |
          TAG="v$(jq -r .version ryui.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match ryui.json's version (expected $TAG)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::releases come from main, not $GITHUB_REF_NAME"
            exit 1
          fi
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$EXISTING" ]; then
            git tag "$TAG"
            git push origin "$TAG" # with this job's token, so it doesn't start another run
          elif [ "$EXISTING" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG is already on another commit; raise version in ryui.json"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: a draft release, unless a re-run already made one
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null || true)
          if [ "$DRAFT" = false ]; then
            echo "::error::$TAG is already released; raise version in ryui.json"
            exit 1
          fi
          if [ -z "$DRAFT" ]; then
            gh release create "$TAG" --draft --generate-notes --verify-tag
          fi

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools } # its default asks for "tools", which the SDK no longer has
      - name: an NDK
        run: ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null || sdkmanager "ndk;27.1.12297006"
      - name: the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::the ANDROID_KEYSTORE secret isn't set; see the README's Release section"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - run: go tool ryui build -android
        env:
          RYUI_KEYSTORE: ${{ runner.temp }}/upload.jks
          RYUI_KEY_ALIAS: upload
          RYUI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/MaskOn.apk --clobber

  ios:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - name: the distribution certificate and the profiles
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE }}
          SHARE_PROFILE: ${{ secrets.IOS_SHARE_PROFILE }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          PW=$(openssl rand -hex 16)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KC" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" "$HOME/Library/Keychains/login.keychain-db"
          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"
          echo "$PROFILE" | base64 --decode > "$PROFILES/maskon.mobileprovision"
          echo "$SHARE_PROFILE" | base64 --decode > "$PROFILES/maskon-share.mobileprovision"
      - run: go tool ryui build -ios
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/MaskOn.ipa --clobber
      - name: upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          xcrun altool --upload-app -f dist/MaskOn.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  publish:
    needs: [release, android, ios]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
